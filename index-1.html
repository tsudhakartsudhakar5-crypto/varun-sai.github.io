<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <title>VARUN SAI — 3D Author Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="hero3d" id="hero3d">
    <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
    <canvas class="particles" id="particles" aria-hidden="true"></canvas>
    <div class="hero-grid" aria-hidden="true"></div>
    <section class="hero-copy" aria-label="Author introduction">
      <p class="eyebrow"><span></span> THE OFFICIAL AUTHOR WEBSITE</p>
      <h1 class="brand-title"><span>VARUN</span><span>SAI<span class="title-period">.</span></span></h1>
      <p class="identity">AUTHOR <i></i> THINKER <i></i> CREATOR</p>
      <div class="gold-rule"></div>
      <p class="book-label">FEATURED BOOK</p>
      <h2 class="book-title">THE TIME<br>CHANGES</h2>
      <p class="tagline">TIME MOVES. LIFE CHANGES. YOU DECIDE.</p>
      <p class="intro">A journey from awareness to transformation.</p>
      <a class="discover" href="#book"><span>DISCOVER THE BOOK</span><b>↗</b></a>
    </section>

    <section class="book-stage" id="book" aria-label="Three-dimensional book showcase">
      <div class="stage-glow"></div>
      <div class="book-shadow"></div>
      <div class="book-float" id="bookFloat">
        <div class="book" id="bookModel" role="img" aria-label="Three-dimensional black and gold book, The Time Changes by Varun Sai">
          <div class="book-pages"></div>
          <div class="book-face book-back"></div>
          <div class="book-face book-front"><img src="assets/the-time-changes-front.jpg" alt="Original front cover of The Time Changes by Varun Sai"></div>
          <div class="book-spine"><span>THE TIME CHANGES</span><small>VARUN SAI</small></div>
          <div class="book-page-edge"></div>
          <div class="book-top-edge"></div>
          <div class="book-bottom-edge"></div>
        </div>
      </div>
      <div class="orbit orbit-a"></div><div class="orbit orbit-b"></div>
      <p class="book-caption">A PHILOSOPHICAL &amp; MOTIVATIONAL BOOK</p>
    </section>
    <div class="scroll-note"><span></span> SCROLL TO EXPLORE</div>
    <div class="hero-index">01 <span>/</span> 04</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
